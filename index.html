<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AccelUAV Flyers</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #e7f0ff;
      background: linear-gradient(160deg, #020916, #061429);
    }
    main { max-width: 560px; text-align: center; }
    h1 { margin: 0 0 12px; }
    p { color: #b4c5df; line-height: 1.55; }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 18px;
      border-radius: 999px;
      color: #001228;
      background: linear-gradient(120deg, #00a6ff, #29d0ff);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Thank you for downloading the AccelUAV brochure</h1>
    <p id="status">Your brochure PDFs are downloading separately.</p>
    <a id="downloadLink" href="#">Download brochures again</a>
  </main>
  <script>
    const status = document.getElementById("status");
    const downloadLink = document.getElementById("downloadLink");

    async function downloadAllFlyers() {
      status.textContent = "Starting your PDF downloads…";

      try {
        const response = await fetch("/api/flyers", { cache: "no-store" });
        const { files = [] } = await response.json();

        if (!response.ok || !files.length) {
          throw new Error("No flyer PDFs are available.");
        }

        files.forEach((fileName, index) => {
          window.setTimeout(() => {
            const downloadFrame = document.createElement("iframe");
            downloadFrame.hidden = true;
            downloadFrame.src = `/download/flyers/${encodeURIComponent(fileName)}`;
            document.body.appendChild(downloadFrame);
            window.setTimeout(() => downloadFrame.remove(), 15000);
          }, index * 400);
        });

        status.textContent = "";
      } catch (error) {
        status.textContent = "The PDF downloads could not be started. Please try again.";
      }
    }

    downloadLink.addEventListener("click", (event) => {
      event.preventDefault();
      downloadAllFlyers();
    });

    downloadAllFlyers();
  </script>
</body>
</html>
